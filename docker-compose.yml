version: '3.9'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: film_lab_user
      POSTGRES_PASSWORD: film_lab_pass
      POSTGRES_DB: film_lab_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://film_lab_user:film_lab_pass@postgres:5432/film_lab_db
      ELASTICSEARCH_URL: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your ignored .env file before starting Compose}
      OPENAI_API_KEY: ''
    depends_on:
      - postgres
      - elasticsearch

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres-data:
  es-data:
